<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #2563eb;
            --accent-dark: #1e40af;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        header {
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            color: #fff;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 20px;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: #fff; }
        .logo:hover { text-decoration: none; }
        .logo span { color: #93c5fd; }
        nav { display: flex; flex-wrap: wrap; gap: 6px; }
        nav a {
            color: #e0e7ff;
            padding: 8px 14px;
            border-radius: 8px;
            transition: background .2s;
        }
        nav a:hover { background: rgba(255, 255, 255, .15); text-decoration: none; }
        nav a.active { background: #fff; color: var(--accent-dark); font-weight: 600; }

        .hero {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 48px 0 40px;
        }
        .hero h1 { font-size: 2.2rem; margin-bottom: 8px; }
        .hero p { color: var(--muted); font-size: 1.1rem; max-width: 700px; }

        main { flex: 1; padding: 40px 0; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
            transition: transform .2s, box-shadow .2s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 0, 0, .08); }
        .card h3 { margin-bottom: 8px; }
        .card p { color: var(--muted); }
        .meta { font-size: .85rem; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
        .avatar {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #60a5fa);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; font-weight: 700;
            margin-bottom: 14px;
        }
        .section-title { font-size: 1.5rem; margin: 32px 0 16px; }
        .section-title:first-child { margin-top: 0; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            background: var(--accent);
            color: #fff;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 600;
        }
        .btn:hover { background: var(--accent-dark); text-decoration: none; }
        .stats { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 8px; }
        .stat { flex: 1; min-width: 150px; text-align: center; }
        .stat b { display: block; font-size: 2rem; color: var(--accent); }

        footer {
            background: #111827;
            color: #9ca3af;
            text-align: center;
            padding: 20px;
            font-size: .9rem;
        }
    </style>
</head>
<body>
<header>
    <div class="container header-inner">
        <a class="logo" href="/">Company</a>
        <nav>
            <a href="/" class="{% if active == 'home' %}active{% endif %}">Home</a>
            <a href="/news/" class="{% if active == 'news' %}active{% endif %}">News</a>
            <a href="/management/" class="{% if active == 'management' %}active{% endif %}">Management</a>
            <a href="/about/" class="{% if active == 'about' %}active{% endif %}">About</a>
            <a href="/contacts/" class="{% if active == 'contacts' %}active{% endif %}">Contacts</a>
        </nav>
    </div>
</header>

<section class="hero">
    <div class="container">
        <h1>{% block heading %}{% endblock %}</h1>
        <p>{% block subheading %}{% endblock %}</p>
    </div>
</section>

<main>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</main>

<footer>
    &copy; 2026 Company. All rights reserved.
</footer>
</body>
</html>
